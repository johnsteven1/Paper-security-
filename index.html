<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bybit Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e0f12;         /* page background */
      --card:#14161b;       /* input container */
      --muted:#8c8f96;      /* muted text */
      --text:#f3f4f6;       /* primary text */
      --brand:#f5a524;      /* Bybit-like yellow */
      --brand-press:#d99117;/* pressed */
      --line:#23262d;       /* subtle borders */
    }*{box-sizing:border-box}
html,body{height:100%}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  display: flex;            /* changed from grid */
  justify-content: center;  /* keep it horizontally centered */
  align-items: flex-start;   /* move it up */
  padding-top: 65px;         /* add space from the top */
}
.wrap{
  width:min(440px, 92vw);
  position:relative;
}

/* top actions */
.topbar{
  position:absolute; inset-inline:0; top:-44px;
  display:flex; justify-content:space-between; align-items:center; gap:.5rem;
}
.topbar a{ color:var(--brand); text-decoration:none; font-weight:500 }

.back-icon {
  display: flex;
  align-items: center;
  color: white; /* white arrow */
  text-decoration: none;
}
.back-icon svg {
  display: block;
}

.panel{
  background:transparent;
  border-radius:18px;
  padding:15px 0 24px;
}

h1{
  margin:0 0 30px; font-size:15px; font-weight:600;
}

/* Tabs */
.tabs{ display:flex; gap:18px; margin-bottom:13px; }
.tab{
  position:relative; cursor:pointer; color:var(--muted); font-weight:600;
  padding-bottom:6px; user-select:none;
}
.tab.active{ color:var(--brand) }
.tab.active::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--brand);
}

/* Field */
.field{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex; align-items:center; gap:10px;
  padding:10px 19px;
  margin-bottom:13px;
}
.field input{ flex:1; background:transparent; border:0; outline:none; color:var(--text); font-size:15px }
.field button.icon{
  border:0; background:transparent; color:var(--muted); cursor:pointer; padding:2px; border-radius:5px;
}
.hint{ text-align:right; margin-top: -10px; margin-bottom:10px }
.hint a{ color:var(--muted); text-decoration:none; font-size:14px }

/* Button */
.btn{
  width:100%;
  background:var(--brand);
  color:#0b0b0c; font-weight:700; font-size:16px;
  border:0; border-radius:10px; padding:11px 18px; cursor:pointer;
  transition:transform .02s ease, background .15s ease;
}
.btn:active{ transform:translateY(1px); background:var(--brand-press); }
.btn:disabled{ opacity:.45; cursor:not-allowed }

.or{ color:var(--muted); text-align:center; margin:14px 0 10px; font-weight:600; }

.oauth{
  display:flex; justify-content:center; gap:16px; margin-bottom:18px;
}
.oauth-btn{
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:15px; width:57px; height:50px; display:grid; place-items:center; cursor:pointer;
}

.subaccount{
  text-align:center; color:var(--muted); margin-top:24px; font-size:14px;
}
.subaccount a{ color:var(--muted); text-decoration:none }

/* tiny helper icons */
.icon svg{ display:block; width:22px; height:22px }
.leading-icon{ width:22px; height:22px; color:var(--muted) }

/* responsive tweak */
@media (max-width:420px){ h1{font-size:24px} }

  </style>
</head>
<body>
  <main class="wrap">
 <div class="topbar">
  <a href="#" class="back-icon" aria-label="Go back" title="Go back">
    <!-- Back arrow icon -->
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <a href="#">Sign Up</a>
</div>
  <h2 id="title">Bybit Login</h2>

  <div class="tabs" role="tablist" aria-label="Login method">
    <div class="tab active" role="tab" aria-selected="true" id="tab-email" tabindex="0">Email</div>
    <div class="tab" role="tab" aria-selected="false" id="tab-mobile" tabindex="-1">Mobile Number</div>
  </div>

  <!-- Email form -->
  <label class="field" id="email-field">
    <span class="leading-icon" aria-hidden="true">
      <!-- Mail icon -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.75 6.75h16.5v10.5A1.5 1.5 0 0 1 18.75 18.75H5.25a1.5 1.5 0 0 1-1.5-1.5V6.75Z" stroke="currentColor" stroke-width="1.5"/><path d="m3.75 7 7.77 5.44a2.25 2.25 0 0 0 2.76 0L22.5 7" stroke="currentColor" stroke-width="1.5"/></svg>
    </span>
    <input id="email" type="email" placeholder="email@example.com" autocomplete="username" />
  </label>
  <!-- Mobile form (hidden initially) -->
  <label class="field" id="mobile-field" style="display:none">
    <span class="leading-icon" aria-hidden="true">
      <!-- phone icon -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.25 3.75h7.5a1.5 1.5 0 0 1 1.5 1.5v13.5a1.5 1.5 0 0 1-1.5 1.5h-7.5a1.5 1.5 0 0 1-1.5-1.5V5.25a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 5.25h6" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
    </span>
    <input id="mobile" type="tel" placeholder="Enter mobile number" autocomplete="tel" />
  </label>

  <!-- Password -->
  <label class="field">
    <span class="leading-icon" aria-hidden="true">
      <!-- password icon (shield/lock) -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 10V8a3.5 3.5 0 1 1 7 0v2" stroke="currentColor" stroke-width="1.5"/></svg>
    </span>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="icon" id="togglePass" aria-label="Show password" title="Show/Hide">
      <!-- eye icon -->
      <svg id="eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </label>

  <div class="hint"><a href="#">Forgot Password</a></div>
      
 <canvas id="canvas" width = "150" height = "7"></canvas> 

  <button id="login" class="btn" disabled>Login Now</button>

<div style="display:flex;align-items:center;text-align:center;opacity:0.7; margin:20px 0;">
  <hr style="flex:1;border:none;border-top:1px solid rgba(85,85,85,0.5);">
  <span style="padding:0 10px;color:rgba(85,85,85,0.8);">Or go with</span>
  <hr style="flex:1;border:none;border-top:1px solid rgba(85,85,85,0.5);">
</div>
    
  <div class="oauth">
    <button class="oauth-btn" aria-label="Continue with Google" title="Continue with Google">
      <!-- Google G -->
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
        <path fill="#FFC107" d="M43.611 20.083H42v-.083H24v8h11.303C33.843 31.978 29.33 35 24 35c-7.18 0-13-5.82-13-13s5.82-13 13-13c3.314 0 6.337 1.261 8.607 3.322l5.657-5.657C34.671 3.042 29.556 1 24 1 11.85 1 2 10.85 2 23s9.85 22 22 22 22-9.85 22-22c0-1.478-.153-2.922-.389-4.417z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.818C14.63 16.019 18.961 13 24 13c3.314 0 6.337 1.261 8.607 3.322l5.657-5.657C34.671 3.042 29.556 1 24 1 16.318 1 9.641 5.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 45c5.258 0 10.042-1.994 13.69-5.27l-6.315-5.348C29.197 36.664 26.734 37.7 24 37.7c-5.285 0-9.757-3.577-11.345-8.427l-6.539 5.038C8.395 39.688 15.59 45 24 45z"/>
        <path fill="#1976D2" d="M43.611 20.083H42v-.083H24v8h11.303c-1.218 3.533-3.86 6.231-7.013 7.701l.007-.005 6.315 5.348C33.405 41.826 42 36 42 23c0-1.478-.153-2.922-.389-4.417z"/>
      </svg>
    </button>
    <button class="oauth-btn" aria-label="Continue with Apple" title="Continue with Apple">
      <!-- Apple logo -->
<svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg" fill="white">
  <path d="M16.365 1.43c0 1.14-.48 2.223-1.255 3.048-.79.84-2.1 1.49-3.206 1.389-.139-1.114.44-2.29 1.22-3.117.785-.834 2.13-1.432 3.241-1.32zM20.4 17.018c-.623 1.42-.92 2.058-1.727 3.32-1.122 1.72-2.703 3.869-4.638 3.885-1.736.016-2.186-1.006-4.06-1.006-1.875 0-2.37.987-4.088 1.023-1.642.03-2.899-1.864-4.028-3.574C.8 18.66-.7 14.048 1.215 10.94c1.047-1.742 2.914-2.842 4.937-2.873 1.933-.037 3.76 1.08 4.94 1.08 1.178 0 3.386-1.33 5.693-1.136.968.04 3.69.39 5.427 2.934-.138.085-3.242 1.874-2.812 6.073z"/>
</svg>
        </button>
  </div>
      <canvas id="canvas" width = "150" height = "209"></canvas>

  <div class="subaccount">Log in with <a href="#">Subaccount</a> →</div>
</section>

  </main><script>
  const tabEmail = document.getElementById('tab-email');
  const tabMobile = document.getElementById('tab-mobile');
  const emailField = document.getElementById('email-field');
  const mobileField = document.getElementById('mobile-field');
  const emailInput = document.getElementById('email');
  const mobileInput = document.getElementById('mobile');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login');

  function setActiveTab(tab){
    const isEmail = tab === 'email';
    tabEmail.classList.toggle('active', isEmail);
    tabMobile.classList.toggle('active', !isEmail);
    tabEmail.setAttribute('aria-selected', isEmail);
    tabMobile.setAttribute('aria-selected', !isEmail);
    tabEmail.tabIndex = isEmail ? 0 : -1;
    tabMobile.tabIndex = isEmail ? -1 : 0;
    emailField.style.display = isEmail ? 'flex' : 'none';
    mobileField.style.display = isEmail ? 'none' : 'flex';
  }

  tabEmail.addEventListener('click', ()=> setActiveTab('email'));
  tabMobile.addEventListener('click', ()=> setActiveTab('mobile'));

  // Password visibility toggle
  const toggle = document.getElementById('togglePass');
  toggle.addEventListener('click', ()=>{
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
  });

  // Enable button when fields are filled
  const inputs = [emailInput, mobileInput, passwordInput];
  function validate(){
    const usingEmail = tabEmail.classList.contains('active');
    const idOk = usingEmail ? !!emailInput.value.trim() : !!mobileInput.value.trim();
    const pwOk = passwordInput.value.trim().length > 0;
    loginBtn.disabled = !(idOk && pwOk);
  }
  inputs.forEach(i => i && i.addEventListener('input', validate));

  // New login click with loading + redirect
  loginBtn.addEventListener('click', ()=>{
    loginBtn.textContent = 'Loading...';
    loginBtn.disabled = true;
    
    // Simulate loading
    setTimeout(()=>{
      window.location.href = "index2.html"; // change to your target page
    }, 2000); // 2 seconds delay
  });

  // Keyboard support for tabs
  [tabEmail, tabMobile].forEach(t => t.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      setActiveTab(t.id === 'tab-email' ? 'mobile' : 'email');
    }
    if(e.key === 'Enter' || e.key === ' '){ t.click(); }
  }));
</script></body>
</html>
